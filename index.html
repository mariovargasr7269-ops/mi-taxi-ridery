<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0a1512">
  <title>Mi Taxi Ridery — Asistente de Radio y Gestor de Jornada</title>
  <meta name="description" content="🚕 App de radio, tarifas y control de jornada para taxistas de Margarita. Funciona offline.">
  <meta property="og:title" content="Mi Taxi Ridery 🚕">
  <meta property="og:description" content="Asistente de radio y gestor de jornada para taxistas">
  <meta property="og:image" content="assets/icons/icon-512.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Leaflet (mapa) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-theme="dark">

  <div id="app">

    <!-- HEADER -->
    <header class="header">
      <div class="header-left">
        <button class="icon-btn" id="btnNotifications" aria-label="Notificaciones">
          🔔<span class="badge" id="notifBadge">0</span>
        </button>
      </div>
      <div class="header-center">
        <h1 class="app-title">
          <span class="title-line">Mi Taxi</span>
          <span class="title-line accent">Ridery</span>
        </h1>
        <div class="logo-car">🚕</div>
      </div>
      <div class="header-right">
        <button class="icon-btn" id="btnTheme" aria-label="Cambiar tema" title="Tema día/noche">🌙</button>
        <button class="icon-btn" id="btnProfile" aria-label="Perfil">
          <span class="avatar" id="avatarEmoji">👤</span>
        </button>
      </div>
    </header>

    <!-- SELECTOR DE BASE -->
    <div class="base-selector">
      <label>Base:</label>
      <select id="selectBase">
        <option value="base1">Base 1 — Ecocenter (García)</option>
        <option value="base234">Base Maneiro / Costa Azul / Ratán / Río</option>
        <option value="base6" selected>Base 6 — Río Terranova</option>
        <option value="base10">Base 10 — Nova Sabanamar</option>
      </select>
    </div>

    <!-- MAPA -->
    <section class="map-section">
      <div id="mapContainer" class="map-container"></div>
      <button class="map-btn locate-btn" id="btnLocate" aria-label="Mi ubicación">🎯</button>
    </section>

    <!-- PANELES TIMER + FARE -->
    <section class="top-panels">
      <div class="shift-timer">
        <div class="timer-ring">
          <svg viewBox="0 0 100 100">
            <circle class="ring-bg" cx="50" cy="50" r="45"/>
            <circle class="ring-progress" cx="50" cy="50" r="45" id="ringProgress"/>
          </svg>
          <div class="timer-content">
            <div class="timer-label">SHIFT TIMER</div>
            <div class="timer-value" id="timerValue">00:00</div>
            <div class="timer-status" id="timerStatus">INACTIVO</div>
          </div>
        </div>
        <div class="timer-display" id="timerFull">00:00:00</div>
        <button class="btn-jornada" id="btnJornada">Iniciando mi 04</button>
      </div>

      <div class="fare-calculator">
        <div class="fare-label">Tarifa</div>
        <div class="fare-amount" id="fareAmount">$0.00</div>
        <div class="fare-details">
          <div><span id="fareDistance">0 km</span> · Distancia</div>
          <div><span id="fareTime">0 min</span> · Tiempo</div>
        </div>
      </div>
    </section>

    <!-- BOTONES RÁPIDOS -->
    <section class="quick-buttons" id="quickButtons">
      <button class="quick-btn zone-a" data-clave="311" data-nombre="El Yaque">
        <span class="qb-icon">🏖️</span>
        <span class="qb-name">El Yaque</span>
        <span class="qb-clave">311</span>
      </button>
      <button class="quick-btn zone-b" data-clave="404" data-nombre="Guacuco">
        <span class="qb-icon">🏖️</span>
        <span class="qb-name">Guacuco</span>
        <span class="qb-clave">404</span>
      </button>
      <button class="quick-btn zone-c" data-clave="259" data-nombre="Playa El Agua">
        <span class="qb-icon">🏖️</span>
        <span class="qb-name">Playa El Agua</span>
        <span class="qb-clave">259</span>
      </button>
      <button class="quick-btn zone-d" data-clave="260" data-nombre="Manzanillo">
        <span class="qb-icon">🏖️</span>
        <span class="qb-name">Manzanillo</span>
        <span class="qb-clave">260</span>
      </button>
      <button class="quick-btn zone-e" data-clave="C-3" data-nombre="C.C. Costa Azul">
        <span class="qb-icon">🏢</span>
        <span class="qb-name">C.C. Costazul</span>
        <span class="qb-clave">C-3</span>
      </button>
      <button class="quick-btn zone-f" data-clave="285" data-nombre="Mata de Coco">
        <span class="qb-icon">🏘️</span>
        <span class="qb-name">Mata de Coco</span>
        <span class="qb-clave">285</span>
      </button>
      <button class="quick-btn zone-g" data-clave="141" data-nombre="Pampatar">
        <span class="qb-icon">🏰</span>
        <span class="qb-name">Pampatar</span>
        <span class="qb-clave">141</span>
      </button>
      <button class="quick-btn zone-h" data-clave="149" data-nombre="Urb. Maneiro">
        <span class="qb-icon">🏘️</span>
        <span class="qb-name">Urb. Maneiro</span>
        <span class="qb-clave">149</span>
      </button>
      <button class="quick-btn add-btn" id="btnAddZone">
        <span class="qb-icon">➕</span>
        <span class="qb-name">Añadir</span>
      </button>
    </section>

    <!-- VOZ -->
    <section class="voice-section">
      <div class="voice-title">Walkie-Talkie Radio Voice</div>
      <button class="voice-button" id="btnVoice">
        <div class="voice-ring"></div>
        <div class="voice-ring"></div>
        <div class="voice-ring"></div>
        <div class="voice-mic">🎤</div>
        <div class="voice-label">SPEAK</div>
      </button>
      <div class="voice-transcript" id="voiceTranscript"></div>
    </section>

    <!-- TRIP DETAILS -->
    <section class="trip-details">
      <div class="trip-title">TRIP DETAILS</div>
      <div class="trip-body">
        <div class="trip-point">
          <span class="dot green"></span>
          <span id="tripOrigin">SIN DESTINO</span>
        </div>
        <div class="trip-arrow">↓</div>
        <div class="trip-point">
          <span class="dot yellow"></span>
          <span id="tripDest">—</span>
        </div>
      </div>
      <div class="trip-meta">
        <span>⏱️ <span id="tripTime">0 min</span></span>
        <span>💰 <span id="tripFare">$0.00</span></span>
      </div>
    </section>

    <!-- ACEPTAR CARRERA -->
    <button class="accept-ride-btn" id="btnAcceptRide">🚕 Aceptar Carrera</button>

    <!-- BOTTOM NAV -->
    <nav class="bottom-nav">
      <button class="nav-btn active" data-screen="dashboard">
        <span class="nav-icon">📊</span><span class="nav-label">Inicio</span>
      </button>
      <button class="nav-btn" data-screen="trips">
        <span class="nav-icon">🗺️</span><span class="nav-label">Viajes</span>
      </button>
      <button class="nav-btn" data-screen="history">
        <span class="nav-icon">📋</span><span class="nav-label">Historial</span>
      </button>
      <button class="nav-btn" data-screen="messages">
        <span class="nav-icon">💬</span><span class="nav-label">Mensajes</span>
      </button>
      <button class="nav-btn" data-screen="settings">
        <span class="nav-icon">⚙️</span><span class="nav-label">Ajustes</span>
      </button>
    </nav>

  </div>

  <!-- MODAL NOTIFICACIONES -->
  <div class="modal-overlay" id="modalNotif">
    <div class="modal">
      <div class="modal-header">
        <h2>🔔 Notificaciones</h2>
        <button class="modal-close" data-close="modalNotif">✕</button>
      </div>
      <div class="modal-body" id="notifList">
        <p class="modal-empty">No hay notificaciones nuevas</p>
      </div>
    </div>
  </div>

  <!-- MODAL PERFIL -->
  <div class="modal-overlay" id="modalProfile">
    <div class="modal">
      <div class="modal-header">
        <h2>👤 Mi Perfil</h2>
        <button class="modal-close" data-close="modalProfile">✕</button>
      </div>
      <div class="modal-body">
        <label class="modal-label">Nombre</label>
        <input type="text" class="modal-input" id="inputNombre" placeholder="Tu nombre" maxlength="40">
        
        <label class="modal-label">Teléfono</label>
        <input type="tel" class="modal-input" id="inputTelefono" placeholder="+58 412 000 0000" maxlength="20">
        
        <label class="modal-label">Vehículo (marca/modelo/color)</label>
        <input type="text" class="modal-input" id="inputVehiculo" placeholder="Ej: Aveo gris, placa ABC123" maxlength="60">
        
        <label class="modal-label">Base habitual</label>
        <select class="modal-input" id="inputBaseHabitual">
          <option value="base1">Base 1 — Ecocenter</option>
          <option value="base234">Base Maneiro / Costa Azul</option>
          <option value="base6" selected>Base 6 — Río Terranova</option>
          <option value="base10">Base 10 — Nova Sabanamar</option>
        </select>
        
        <button class="modal-btn-primary" id="btnSaveProfile">💾 Guardar</button>
      </div>
    </div>
  </div>

  <!-- SCRIPTS (orden importa) -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/database.js"></script>
  <script src="js/voice.js"></script>
  <script src="js/mapa.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
